{% extends "base.html" %}
{% block title %}Simon Game{% endblock %}
{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/simon.css') }}" />
{% endblock %}
{% block content %}
<section class="simon">
  <div class="simon-hud">
    <p id="levelText">Level: 0</p>
    <p>High Score: <span id="highScore">0</span></p>
  </div>

  <div class="simon-grid">
      {% for number in range(1, 10) %}
          <button type="button" class="simon-btn" data-number="{{ number }}">
              {{ number }}
          </button>
      {% endfor %}
  </div>

  <button type="button" id="startBtn" class="simon-start">Start</button>
</section>

<script src="{{ url_for('static', filename='javascript/simon.js') }}"></script>
{% endblock %}
