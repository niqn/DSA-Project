[project]
name = "dsa-project"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "flask-wtf>=1.3.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
dsa-project = "dsa_project:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
